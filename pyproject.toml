[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surface-explorer"
version = "1.0.0"
description = "Interactive multi-variable function visualizer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
]

[project.scripts]
surface-explorer = "surface_explorer.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
